plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

repositories {
    mavenCentral()
}

configurations {
    winRuntime
}

javafx {
    version = '21.0.1'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

application {
    mainClass.set("chatbox.main.Launcher")
}

shadowJar {
    archiveBaseName = "zhengjun-chatbox"
    archiveClassifier = null
    configurations = [project.configurations.runtimeClasspath, project.configurations.winRuntime]
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    String junitVersion = '5.10.0'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: junitVersion
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junitVersion

    String javaFxVersion = '21.0.1'
    winRuntime "org.openjfx:javafx-base:${javaFxVersion}:win"
    winRuntime "org.openjfx:javafx-controls:${javaFxVersion}:win"
    winRuntime "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    winRuntime "org.openjfx:javafx-graphics:${javaFxVersion}:win"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
